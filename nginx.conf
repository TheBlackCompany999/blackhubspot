events {
    worker_connections 1024;
}

http {
    upstream workadventure-front {
        server workadventure-front:80;
    }

    upstream workadventure-back {
        server workadventure-back:8080;
    }

    upstream workadventure-pusher {
        server workadventure-pusher:8080;
    }

    upstream workadventure-uploader {
        server workadventure-uploader:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Main frontend
        location / {
            proxy_pass http://workadventure-front;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API routes
        location /api/ {
            proxy_pass http://workadventure-back;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Pusher WebSocket
        location /pusher/ {
            proxy_pass http://workadventure-pusher;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # File uploader
        location /uploader/ {
            proxy_pass http://workadventure-uploader;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 10m;
        }

        # CORS for assets
        location /assets/ {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            proxy_pass http://workadventure-front;
        }
    }
}